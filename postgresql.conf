#!/bin/bash
# ==============================================================================
# Hands‑On Lab: Backups, Point‑in‑Time Recovery, and Replication
# ==============================================================================

set -e

echo "=== Step 1: Take and Verify a Logical Backup ==="
mkdir -p ~/backups
pg_dump -Fc -f ~/backups/bootcamp.dump bootcamp
pg_restore --list ~/backups/bootcamp.dump | head

# Verify by restoring to a check database
createdb bootcamp_check || true
pg_restore -d bootcamp_check ~/backups/bootcamp.dump
echo "Logical backup verified successfully."

echo "=== Step 2: Enable WAL Archiving ==="
mkdir -p ~/backups/wal

# Note: Adjust paths or use sudo tee to update postgresql.conf if required for your environment
# The following assumes standard configuration block inclusion or direct manual appending:
sudo bash -c 'cat >> /etc/postgresql/*/main/postgresql.conf <<EOF
wal_level = replica
archive_mode = on
archive_command = '\''cp %p /home/`whoami`/backups/wal/%f'\''
EOF'

sudo systemctl restart postgresql

# Take base backup
pg_basebackup -D ~/backups/base -Ft -z -Xs -P
echo "WAL archiving configured and base backup completed."

echo "=== Step 3: Simulate Disaster & PITR Setup ==="
# Connect and run simulation commands in psql:
# SELECT now();   -- Record timestamp here
# DELETE FROM students;

echo "To perform PITR after a disaster:"
echo "1. Stop postgresql: sudo systemctl stop postgresql"
echo "2. Restore data directory from ~/backups/base"
echo "3. Add recovery settings to postgresql.conf:"
echo "   restore_command = 'cp ~/backups/wal/%f %p'"
echo "   recovery_target_time = 'YYYY-MM-DD HH:MM:SS'"
echo "4. Start postgresql: sudo systemctl start postgresql"

echo "=== Step 4: Set Up Streaming Standby ==="
# Execute on primary database:
psql -c "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'reppass';" || true

sudo bash -c 'echo "host replication replicator 127.0.0.1/32 md5" >> /etc/postgresql/*/main/pg_hba.conf'
sudo systemctl reload postgresql

# Build standby directory
pg_basebackup -h 127.0.0.1 -U replicator -D ~/standby -R -P
echo "Standby configured at ~/standby."

echo "=== Step 5: Replication Health Query ==="
cat << 'EOF'
Run this on the primary to check replication lag:
SELECT application_name, state,
       pg_wal_lsn_diff(sent_lsn, replay_lsn) AS lag_bytes
FROM pg_stat_replication;
EOF
